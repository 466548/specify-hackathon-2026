[project]
name = "specify-backend"
version = "0.1.0"
description = "Specify backend - PRD から意思決定論点を炙り出すマルチエージェント"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Microsoft Agent Framework 1.0（オーケストレーション）
    # PyPI パッケージ名は "microsoft-agent-framework" ではなく "agent-framework-*"。
    # "core" は抽象化レイヤー、プロバイダー実装は別パッケージで追加する形:
    #   - agent-framework-core   コア抽象化（必須）
    #   - agent-framework-openai OpenAI プロバイダー（OpenAIChatClient はここ）
    # フル版 "agent-framework" や "agent-framework-foundry" は今は不要。
    "agent-framework-core>=1.2.2",
    "agent-framework-openai>=1.2.2",
    # オーケストレーション（ConcurrentBuilder など）も別パッケージで提供されている。
    # 2026-05 時点では beta 版しか公開されていないため、メジャー固定 + 上限なしで取り込む。
    "agent-framework-orchestrations>=1.0.0b0",
    # OpenAI クライアント（agent-framework-openai が内部で使う）
    "openai",
    # .env 読み込み（Agent Framework は自動で .env を読まないため必須）
    "python-dotenv",
    # Notion API クライアント（Past PRD Agent が KintaiKit の過去 PRD を取得するのに使う）。
    # 個人 Internal Integration 経由で読み取り専用利用。
    # 3.x で "Data Sources" API 概念が導入され databases.query → data_sources.query に
    # 変わったため、3.0 以上で固定する（実装はこの新 API 前提）。
    "notion-client>=3.0.0",
    # Week 5: フロントから叩く HTTP インターフェース。FastAPI + Uvicorn + sse-starlette。
    # sse-starlette は heartbeat / close 検知を自動でやってくれる SSE 用ラッパ。
    # uvicorn[standard] は ws / httptools などの C 実装拡張を含む推奨セット。
    "fastapi>=0.115",
    "sse-starlette>=2.1",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
specify = "specify_backend.cli:main"
# Week 5: FastAPI を uvicorn で起動するエントリ。`uv run specify-api` で 8000 番に listen する。
specify-api = "specify_backend.api:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/specify_backend"]
